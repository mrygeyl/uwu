<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8e9e7">
<title>Sorry na po :< </title>
<style>
:root {
  --site-primary: #d88f9c;
  --site-on-primary: #fffaf8;
  --site-secondary: #f1d6d2;
  --site-on-secondary: #68434a;
  --site-background: #f8eeea;
  --site-on-background: #4c3438;
  --site-font-body: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --site-font-heading: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; font-family: var(--site-font-body); }
#app {
  min-height: 100vh;
  width: 100%;
  border-radius: 0;
  position: relative;
  overflow: hidden;
  color: light-dark(var(--site-on-background), #f6e9e7);
  background-color: var(--site-background);
  background-image: radial-gradient(ellipse at 15% 10%, #fff9f4 0, transparent 38%),
                    radial-gradient(ellipse at 90% 85%, #efd2d1 0, transparent 36%);
  isolation: isolate;
}
#app::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
  background: linear-gradient(135deg, color-mix(in srgb, var(--site-secondary) 25%, transparent), transparent 55%);
}
main { width: min(100% - 36px, 980px); margin: 0 auto; padding: 34px 0 56px; }
.hero { min-height: min(82vh, 760px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:38px 0 54px; }
h1 { font-size:clamp(3.2rem, 9vw, 6.8rem); line-height:.98; letter-spacing:-.055em; font-weight:400; margin:0; color:#754b54; text-wrap:balance; }
h1 em { font-weight:400; color:#c17d89; }
.title-button { appearance:none; border:0; padding:0; margin:0; background:none; color:inherit; font:inherit; cursor:pointer; border-radius:18px; transition:transform .25s ease, filter .25s ease; }
.title-button:hover { transform:translateY(-4px); filter:drop-shadow(0 8px 14px #d7a6aa66); }
.title-button:focus-visible, button:focus-visible { outline:3px solid #a65c70; outline-offset:6px; }
.hearts { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; opacity:var(--site-decoration-opacity); }
.float-heart { position:absolute; bottom:-50px; color:#d18e9b; opacity:.32; animation:floatUp linear infinite; }
.content { position:relative; z-index:1; }
@keyframes floatUp { from { transform:translateY(0) rotate(0deg); opacity:0; } 12% {opacity:.35;} to { transform:translateY(-115vh) rotate(25deg); opacity:0; } }
.modal { position:fixed; inset:0; z-index:10; display:none; place-items:center; padding:22px; background:#29191fc9; backdrop-filter:blur(9px); }
.modal.open { display:grid; animation:fadeIn .25s ease; }
.modal-card { position:relative; width:min(100%,530px); padding:18px 18px 24px; border-radius:24px; background:#fff8f4; box-shadow:0 28px 90px #14090b66; text-align:center; animation:rise .35s ease; }
.modal-card img { display:block; width:min(100%,390px); max-height:65vh; object-fit:contain; margin:0 auto; border-radius:13px; background:white; }
.close { position:absolute; top:10px; right:12px; width:38px; height:38px; border:0; border-radius:50%; background:#f3e1dc; color:#704b54; font-size:1.35rem; cursor:pointer; }
@keyframes fadeIn {from{opacity:0}to{opacity:1}}
@keyframes rise {from{transform:translateY(14px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@media (max-width:600px) {
 main { width:min(100% - 28px, 980px); padding-top:24px; }
 .hero { min-height:78vh; padding:35px 0; }
}
@media (prefers-reduced-motion: reduce) {
 *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="hearts" aria-hidden="true" id="hearts"></div>
  <div class="content">
    <main>
      <section class="hero" aria-labelledby="welcome-title">
        <button class="title-button" id="openPicture" aria-label="Open our special picture">
          <h1 id="welcome-title">Sorry na po,<br><em>bebe.</em></h1>
        </button>
      </section>
    </main>
  </div>
</div>

<script>
const modal = document.getElementById('pictureModal');
const openButton = document.getElementById('openPicture');
const closeButton = document.getElementById('closePicture');
function openModal() { modal.classList.add('open'); closeButton.focus(); }
function closeModal() { modal.classList.remove('open'); openButton.focus(); }
openButton.addEventListener('click', openModal);
closeButton.addEventListener('click', closeModal);
modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
const hearts = document.getElementById('hearts');
for (let i = 0; i < 18; i++) {
  const heart = document.createElement('span');
  heart.className = 'float-heart';
  heart.textContent = i % 3 === 0 ? '♡' : '♥';
  heart.style.left = (Math.random() * 100) + '%';
  heart.style.fontSize = (12 + Math.random() * 19) + 'px';
  heart.style.animationDuration = (12 + Math.random() * 16) + 's';
  heart.style.animationDelay = (-Math.random() * 24) + 's';
  hearts.appendChild(heart);
}
</script>
